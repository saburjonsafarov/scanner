# CD библиотеки scanner: тег `v*` → Maven-артефакты в GitHub Packages + GitHub Release
# с ScannerCore.xcframework как ассетом.
#
# Раннер — macOS, и это не прихоть: iOS-klib'ы собираются только на macOS (урок compose-graph),
# а публиковать KMP-библиотеку без iOS-таргетов значит публиковать другую библиотеку.
#
# Release-ассет вместо upload-artifact — тоже урок: артефакты Actions всегда завёрнуты в zip
# и умирают по retention, а ссылка releases/download/<tag>/<file> постоянная.
#
# Порядок шагов не случаен: XCFramework собирается ДО публикации в Packages — падение на нём
# не должно оставлять релиз полуопубликованным (Maven-артефакты есть, ассета нет).

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # создание GitHub Release и загрузка ассетов
  packages: write   # публикация Maven-артефактов в GitHub Packages

concurrency:
  group: release
  # Никогда не отменять публикацию на середине: второй тег подождёт первого.
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.configuration-cache=false

jobs:
  release:
    name: Публикация ${{ github.ref_name }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # На macOS arm64-образах GitHub нет Android SDK, а publish собирает и Android-модули.
      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      # Имя тега — внешний вход: в run оно попадает только через env (script injection, lessons-ci).
      # Версия валидируется: тег `v` или `vfoo` не должен уехать в Packages пустой или мусорной версией.
      - name: Версия из тега
        env:
          RAW_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RAW_TAG#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "Тег «$RAW_TAG» не похож на версию (ожидается vX.Y.Z[-суффикс])" >&2
            exit 1
          fi
          echo "SCANNER_VERSION=$VERSION" >> "$GITHUB_ENV"

      # Тем же набором свойств, что и публикация: проверяться должно то, что публикуется,
      # а не соседняя конфигурация под другим гейтом.
      - name: Тесты перед публикацией
        run: >
          ./gradlew
          :scanner-core:jvmTest
          :scanner-core:iosSimulatorArm64Test
          "-Pscanner.version=$SCANNER_VERSION"
          --stacktrace

      - name: Сборка XCFramework
        run: ./gradlew :scanner-core:assembleScannerCoreReleaseXCFramework "-Pscanner.version=$SCANNER_VERSION" --stacktrace

      - name: Публикация в GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish "-Pscanner.version=$SCANNER_VERSION" --stacktrace

      - name: GitHub Release с XCFramework
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW_TAG: ${{ github.ref_name }}
        run: |
          cd scanner-core/build/XCFrameworks/release
          zip -r "ScannerCore-$SCANNER_VERSION.xcframework.zip" ScannerCore.xcframework
          # Не глушить ошибки create: `|| true` маскировал бы и проблему прав, и битый тег.
          if ! gh release view "$RAW_TAG" >/dev/null 2>&1; then
            gh release create "$RAW_TAG" --title "$RAW_TAG" --generate-notes
          fi
          gh release upload "$RAW_TAG" "ScannerCore-$SCANNER_VERSION.xcframework.zip" --clobber
