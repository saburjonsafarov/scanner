# CI библиотеки scanner.
#
# Три джобы по цене вопроса:
#  - core    — самый быстрый и самый ценный сигнал: тесты ядра на JVM, без Android SDK;
#  - android — сборка Android-цепочки: release-варианты библиотек (публикуются именно они,
#              а не debug) + APK сэмпла;
#  - ios     — тесты ядра на iOS-симуляторе, iOS-компиляция всех модулей, XCFramework
#              и publishToMavenLocal как смоук релизного пути (только macOS умеет
#              линковать Apple-таргеты).
#
# TODO(Saburjon): экшены запинить по commit SHA (правило lessons-ci). Из сессии, где писался файл,
# SHA чужих репозиториев недостоверно не достать; до перепиновки актуальность держит Dependabot.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Отменять устаревшие раны только на PR: на main каждый коммит должен быть проверен целиком.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Configuration cache в CI без cache-encryption-key не переживает границу ранов:
  # каждый ран платил бы за построение записи, получая взамен только новую поверхность отказа.
  GRADLE_OPTS: -Dorg.gradle.configuration-cache=false

jobs:
  core:
    name: Ядро (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Гейт -Pscanner.targets=core оставляет в сборке одно ядро: джоба не зависит
      # ни от Android SDK, ни от Apple-тулчейна и потому падает только по делу.
      - name: Тесты ядра
        run: ./gradlew -Pscanner.targets=core :scanner-core:jvmTest --stacktrace

      - name: Отчёт о тестах при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: scanner-core/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android (release-библиотеки)
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Android SDK предустановлен на GitHub-hosted ubuntu-раннерах; ставить его руками
      # нужно только на self-hosted и на macOS (урок lessons-ci + arm64-образы без SDK).
      #
      # Собираются release-варианты библиотек: публикуются именно они. Сэмпл в CI
      # не собирается (-Pscanner.withSample=false) — причина в settings.gradle.kts.
      - name: Сборка release-библиотек
        run: >
          ./gradlew -Pscanner.withSample=false
          :scanner-camera:assembleRelease
          :scanner-ui:assembleRelease
          --stacktrace

  ios:
    name: iOS (тесты симулятора + XCFramework + смоук публикации)
    runs-on: macos-latest
    needs: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # На macOS arm64-образах GitHub нет Android SDK, а конфигурация проекта тянет AGP
      # (scanner-camera/ui/sample) — без SDK джоба падает ещё до iOS-тасок.
      # TODO(Saburjon): запинить по SHA вместе с остальными экшенами.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Тесты ядра на iOS-симуляторе
        run: ./gradlew -Pscanner.withSample=false :scanner-core:iosSimulatorArm64Test --stacktrace

      - name: iOS-компиляция camera и ui
        run: >
          ./gradlew -Pscanner.withSample=false
          :scanner-camera:compileKotlinIosSimulatorArm64
          :scanner-ui:compileKotlinIosSimulatorArm64
          --stacktrace

      - name: Сборка XCFramework
        run: ./gradlew -Pscanner.withSample=false :scanner-core:assembleScannerCoreReleaseXCFramework --stacktrace

      # Смоук релизного пути: та же публикация, что и на теге, только в локальный каталог.
      # Ловит "модуль без maven-publish", битые POM и несобираемые klib'ы до релиза.
      - name: Смоук публикации (publishToMavenLocal)
        run: ./gradlew -Pscanner.withSample=false publishToMavenLocal --stacktrace

      - name: Отчёт о тестах при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-report
          path: scanner-core/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: ScannerCore-xcframework
          path: scanner-core/build/XCFrameworks/release/
          if-no-files-found: error
          retention-days: 14
