org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Без явного значения демон Kotlin наследует org.gradle.jvmargs — два процесса по 4 ГБ
# не помещаются в 7 ГБ macos-arm64 раннера GitHub.
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

# `all` — все модули (нужны Android SDK и, для iOS, macOS).
# `core` — только :scanner-core на JVM: собирается где угодно, включая окружения без Android-тулчейна.
scanner.targets=all
