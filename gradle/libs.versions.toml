[versions]
# Kotlin намеренно 2.3.x, а не 2.4.x: AGP 9.2.1 при инициализации встроенного Kotlin
# зовёт KotlinBaseApiPlugin из KGP в класспуте, и KGP 2.4.10 отвечает классом KotlinAndroidTarget
# со ссылкой на выпиленный в AGP 9 BaseVariant → NoClassDefFoundError (прогон CI №4).
# Связка AGP 9.2.1 + Kotlin 2.3.21 + CMP 1.11.1 проверена в бою (compose-graph).
kotlin = "2.3.21"
coroutines = "1.11.0"

# Версии подтверждены фактом: резолв и сборка прошли в CI (прогоны №5–№7, август 2026).
agp = "9.2.1"
composeMultiplatform = "1.12.2"
androidxCamera = "1.4.2"
androidxActivity = "1.11.0"
androidxCore = "1.16.0"

# Сверено с Maven Central 11.08.2026 (JetBrains-редистрибуция для Compose Multiplatform).
jetbrainsLifecycle = "2.11.0"

# material3 версионируется отдельно от Compose MP (1.11.1 у него не существует — проверено
# по индексу Central 12.08.2026); стабильная линия — 1.9.x.
cmpMaterial3 = "1.9.0"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "androidxCamera" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "androidxCamera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "androidxCamera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "androidxCamera" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
jetbrains-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "jetbrainsLifecycle" }
jetbrains-compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
jetbrains-compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
jetbrains-compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
jetbrains-compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "cmpMaterial3" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
